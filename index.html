<meta charset="utf-8" />
<title>GMO×国会議員 関係DB</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    color-scheme: light;
    --shell-bg:#ffffff; --shell-border:#e3e3e0; --shell-ink:#1a1a19; --shell-ink-muted:#84837e;
    --shell-accent:#2b3a5c;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --shell-bg:#17191c; --shell-border:#30322f; --shell-ink:#e8e6de; --shell-ink-muted:#8b897f;
      --shell-accent:#8ea0cc;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --shell-bg:#17191c; --shell-border:#30322f; --shell-ink:#e8e6de; --shell-ink-muted:#8b897f;
    --shell-accent:#8ea0cc;
  }
  *{box-sizing:border-box;}
  html, body{ margin:0; height:100%; }
  body{
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:var(--shell-bg); color:var(--shell-ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .shell-topbar{
    display:flex; align-items:center; gap:4px; flex:none;
    padding:10px 18px 0; border-bottom:1px solid var(--shell-border);
  }
  .shell-brand{
    font-size:13.5px; font-weight:700; letter-spacing:.01em; color:var(--shell-ink);
    margin-right:18px; padding-bottom:10px;
  }
  .shell-tab{
    font:inherit; font-size:13.5px; font-weight:600; color:var(--shell-ink-muted);
    background:none; border:none; border-bottom:2px solid transparent;
    padding:8px 16px 10px; cursor:pointer; margin-bottom:-1px;
  }
  .shell-tab.active{ color:var(--shell-ink); border-bottom-color:var(--shell-accent); }
  .shell-tab:hover{ color:var(--shell-ink); }
  .shell-body{ flex:1; min-height:0; position:relative; }
  .shell-frame{
    position:absolute; inset:0; width:100%; height:100%; border:none; display:none;
  }
  .shell-frame.active{ display:block; }
</style>

<div class="shell-topbar">
  <div class="shell-brand">議員関係DB</div>
  <button class="shell-tab active" data-tab="summary" id="tabSummary">全体サマリ</button>
  <button class="shell-tab" data-tab="detail" id="tabDetail">個別ページ</button>
  <button class="shell-tab" data-tab="bulk" id="tabBulk">一括追加</button>
</div>
<div class="shell-body">
  <iframe class="shell-frame active" id="frameSummary" src="summary.html"></iframe>
  <iframe class="shell-frame" id="frameDetail"></iframe>
  <iframe class="shell-frame" id="frameBulk"></iframe>
</div>

<script>
var frameSummary = document.getElementById('frameSummary');
var frameDetail = document.getElementById('frameDetail');
var frameBulk = document.getElementById('frameBulk');
var tabSummary = document.getElementById('tabSummary');
var tabDetail = document.getElementById('tabDetail');
var tabBulk = document.getElementById('tabBulk');
var detailLoaded = false;
var bulkLoaded = false;

function activateTab(name){
  tabSummary.classList.toggle('active', name === 'summary');
  tabDetail.classList.toggle('active', name === 'detail');
  tabBulk.classList.toggle('active', name === 'bulk');
  frameSummary.classList.toggle('active', name === 'summary');
  frameDetail.classList.toggle('active', name === 'detail');
  frameBulk.classList.toggle('active', name === 'bulk');
}

tabSummary.addEventListener('click', function(){ activateTab('summary'); });
tabDetail.addEventListener('click', function(){
  if (!detailLoaded) { frameDetail.src = 'detail.html'; detailLoaded = true; }
  activateTab('detail');
});
tabBulk.addEventListener('click', function(){
  if (!bulkLoaded) { frameBulk.src = 'bulk.html'; bulkLoaded = true; }
  activateTab('bulk');
});

window.addEventListener('message', function(ev){
  if (!ev.data || typeof ev.data !== 'object') return;
  if (ev.data.type === 'open-detail' && ev.data.id) {
    frameDetail.src = 'detail.html?id=' + encodeURIComponent(ev.data.id);
    detailLoaded = true;
    activateTab('detail');
  } else if (ev.data.type === 'open-summary') {
    activateTab('summary');
  }
});
</script>
